name: System Report

on:
  push:

jobs:

  system-info:
    runs-on: ubuntu-latest

    steps:
      - name: Print OS and kernel
        run: uname -a

      - name: Print free disk space
        run: df -h

      - name: Print current date and time
        run: date

      - name: Install tree
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Display home directory structure
        run: tree -L 2 "$HOME"


  tool-check:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create report.json
        run: |
          cat > report.json <<EOF
          {
            "name": "System Report",
            "status": "success",
            "environment": "GitHub Actions"
          }
          EOF

      - name: Read value using jq
        run: jq '.status' report.json

      - name: Print Python version
        run: python3 --version

      - name: Print Git version
        run: git --version

      - name: Print jq version
        run: jq --version

      - name: Finish report
        run: echo "Report complete"
        