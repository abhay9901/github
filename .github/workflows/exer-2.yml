name: exer-2

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Print target branch
        run: echo "Target branch: ${{ github.event.pull_request.base.ref }}"

      - name: Print PR number
        run: echo "PR number: ${{ github.event.pull_request.number }}"

      - name: Complete
        run: echo "Gatekeeper checks complete"